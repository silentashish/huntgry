# Installable desktop builds on a DRAFT GitHub Release (#167), see docs/install.md "Cutting a release".
#
# A `v*` tag (pushed by `npm version <x.y.z>` + `git push --follow-tags`) builds the macOS
# (arm64 + x64 dmg and zip), Windows (NSIS) and Linux (AppImage) packages, writes SHA256SUMS.txt
# over all of them and attaches everything to a draft release whose notes list the PRs merged
# since the previous tag. Nothing is published: the draft is reviewed and published by hand.
#
# No Apple Developer ID yet: the macOS app is signed ad hoc (electron-builder.yml) and not
# notarized, so Gatekeeper asks for "Open Anyway" on first launch. Signing and notarization: #168.
name: release

on:
  push:
    tags: ['v*']

# One run per tag; a re-pushed tag waits for the previous run instead of racing it on the release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 26

jobs:
  # The tag is the version: `v1.2.3` must match package.json's `1.2.3`, which `npm version` bumps
  # in the same commit it tags. A tag pushed by hand on a commit with another version stops here.
  version:
    name: check the tag matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error title=Version mismatch::Tag $TAG does not match package.json version $pkg (expected tag v$pkg). Cut releases with \`npm version <x.y.z>\` and push the tag it creates."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          # 1.2.3-beta.1 and the like go out as pre-releases.
          case "$pkg" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  build:
    name: build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          # One Apple Silicon runner builds both architectures; no native modules, so x64 cross-packs fine.
          - name: macOS
            os: macos-latest
            args: --mac --arm64 --x64
            electron-cache: ~/Library/Caches/electron
            files: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            args: --win --x64
            electron-cache: ~/AppData/Local/electron/Cache
            files: release/*.exe
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
            electron-cache: ~/.cache/electron
            files: release/*.AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Read the Electron version from the lockfile
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"

      # `npm ci` (electron's postinstall) and electron-builder both download Electron into this folder.
      - name: Cache the Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.electron-cache }}
          key: electron-release-${{ runner.os }}-${{ steps.electron.outputs.version }}

      - run: npm ci

      # `npm run build` type-checks every workspace first, as `npm run dist` does locally.
      - run: npm run build

      # --publish never: the release job below uploads the files; electron-builder must not
      # create a release of its own from the tag. No signing identity is looked up (ad hoc on macOS).
      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft the GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --generate-notes: GitHub lists the PRs merged since the previous tag (and new contributors).
      # --verify-tag: never let `gh` create a tag; the pushed one is the release.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "Huntgry $VERSION")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*
          {
            echo "### Draft release $TAG"
            echo
            echo "Review the notes and the files, then publish it by hand: $(gh release view "$TAG" --json url --jq .url)"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
