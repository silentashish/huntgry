<!-- Lever application form (jobs.lever.co/<company>/<posting-id>/apply). Built 2026-09-30 from Lever's documented
     server-rendered markup (field names name, email, phone, org, urls[...], resume, comments, cards[...], eeo[...]);
     employer text and posting ids are placeholders. Not captured live: re-check against a real page in the in-app
     browser (fill only, never submit) before relying on a new field. -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Acme - Software Engineer</title></head><body>
<div class="content-wrapper application-page">
<div class="section-wrapper page-full-width">
<h2 class="posting-headline">Software Engineer</h2>
<form id="application-form" method="POST" enctype="multipart/form-data" action="/acme/00000000-0000-4000-8000-000000000001/apply">
  <input type="hidden" name="accountId" value="00000000-0000-4000-8000-00000000000a">
  <input type="hidden" name="origin" value="">
  <div class="section application-form">
    <h4>Submit your application</h4>
    <ul>
      <li class="application-question resume">
        <label>
          <div class="application-label">Resume/CV<span class="required">✱</span></div>
          <div class="application-field">
            <a class="visible-resume-upload"><span class="default-label">ATTACH RESUME/CV</span><input type="file" class="application-file-input" id="resume-upload-input" name="resume" data-qa="input-resume"></a>
            <span class="filename"></span>
          </div>
        </label>
      </li>
      <li class="application-question">
        <label>
          <div class="application-label">Full name<span class="required">✱</span></div>
          <div class="application-field"><input type="text" name="name" required data-qa="name-input"></div>
        </label>
      </li>
      <li class="application-question">
        <label>
          <div class="application-label">Email<span class="required">✱</span></div>
          <div class="application-field"><input type="email" name="email" required data-qa="email-input"></div>
        </label>
      </li>
      <li class="application-question">
        <label>
          <div class="application-label">Phone</div>
          <div class="application-field"><input type="text" name="phone" data-qa="phone-input"></div>
        </label>
      </li>
      <li class="application-question">
        <label>
          <div class="application-label">Current location</div>
          <div class="application-field"><input type="text" name="location" id="location-input" data-qa="location-input" autocomplete="off"></div>
        </label>
      </li>
      <li class="application-question">
        <label>
          <div class="application-label">Current company</div>
          <div class="application-field"><input type="text" name="org" data-qa="org-input"></div>
        </label>
      </li>
    </ul>
  </div>
  <div class="section application-form">
    <h4>Links</h4>
    <ul>
      <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
      <li class="application-question"><label><div class="application-label">Twitter URL</div><div class="application-field"><input type="text" name="urls[Twitter]"></div></label></li>
      <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
      <li class="application-question"><label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="urls[Portfolio]"></div></label></li>
      <li class="application-question"><label><div class="application-label">Other website</div><div class="application-field"><input type="text" name="urls[Other]"></div></label></li>
    </ul>
  </div>
  <div class="section application-form">
    <h4>Additional questions</h4>
    <ul>
      <li class="application-question custom-question">
        <label>
          <div class="application-label">What interests you about this role?<span class="required">✱</span></div>
          <div class="application-field"><textarea name="cards[00000000-0000-4000-8000-0000000000c1][field0]" required></textarea></div>
        </label>
      </li>
      <li class="application-question custom-question">
        <div class="application-label">Will you require visa sponsorship?<span class="required">✱</span></div>
        <div class="application-field">
          <ul data-qa="multiple-choice">
            <li><label><input type="radio" name="cards[00000000-0000-4000-8000-0000000000c1][field1]" value="Yes"><span>Yes</span></label></li>
            <li><label><input type="radio" name="cards[00000000-0000-4000-8000-0000000000c1][field1]" value="No"><span>No</span></label></li>
          </ul>
        </div>
      </li>
    </ul>
  </div>
  <div class="section application-form">
    <h4>Additional information</h4>
    <div class="application-additional"><textarea name="comments" id="additional-information" placeholder="Add a cover letter or anything else you want to share."></textarea></div>
  </div>
  <div class="section application-form eeo-section">
    <h4>U.S. Equal Employment Opportunity information</h4>
    <ul>
      <li class="application-question"><label><div class="application-label">Gender</div><div class="application-field"><select name="eeo[gender]"><option value="">Select ...</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></div></label></li>
      <li class="application-question"><label><div class="application-label">Race</div><div class="application-field"><select name="eeo[race]"><option value="">Select ...</option><option>Decline to self-identify</option></select></div></label></li>
    </ul>
  </div>
  <div class="section application-form">
    <label class="consent"><input type="checkbox" name="consent[marketing]" value="true"> I agree to be contacted about future opportunities.</label>
  </div>
  <div class="section last-section-apply">
    <button type="submit" class="template-btn-submit postings-btn" id="btn-submit" data-qa="btn-submit">Submit application</button>
  </div>
</form>
</div>
</div>
</body></html>
