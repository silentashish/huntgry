<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Huntgry app icon: a resume under a magnifying glass. Source for build/icon.png and build/icon.icns. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0B1B3F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="252" y="212" width="410" height="530" rx="46" fill="#FFFFFF"/>
  </g>
  <circle cx="344" cy="320" r="44" fill="#14B8A6"/>
  <rect x="410" y="292" width="200" height="24" rx="12" fill="#1E3A8A"/>
  <rect x="410" y="334" width="136" height="18" rx="9" fill="#94A3B8"/>
  <rect x="300" y="418" width="314" height="20" rx="10" fill="#CBD5E1"/>
  <rect x="300" y="470" width="270" height="20" rx="10" fill="#CBD5E1"/>
  <rect x="300" y="522" width="190" height="20" rx="10" fill="#CBD5E1"/>
  <rect x="300" y="574" width="150" height="20" rx="10" fill="#CBD5E1"/>
  <g filter="url(#shadow)">
    <line x1="724" y1="724" x2="806" y2="806" stroke="#F59E0B" stroke-width="64" stroke-linecap="round"/>
    <circle cx="628" cy="628" r="128" fill="#FFFFFF" fill-opacity="0.22" stroke="url(#lens)" stroke-width="46"/>
  </g>
</svg>
